name: claude-ci-autofix

# On a failed PR build, Claude proposes a fix on a SEPARATE claude/autofix-* branch.
# It never rewrites the PR branch. Advisory only; never a required check.
# Loop breaker: with allowed_bots empty, the action refuses runs whose triggering actor is claude[bot].

on:
  # zizmor: ignore[dangerous-triggers] -- same-repo claude/** heads only; head is Aaron's or Claude's own branch
  workflow_run:
    workflows: ["Chimera Android CI/CD", "CI", "PR Checks"]
    types: [completed]

permissions: {}

jobs:
  autofix:
    if: |
      vars.CLAUDE_PAUSE != 'true' &&
      github.actor != 'dependabot[bot]' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !startsWith(github.event.workflow_run.head_branch, 'claude/autofix-')
    runs-on: ${{ vars.CLAUDE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    concurrency:
      group: claude-autofix-${{ github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
      actions: read
      id-token: write
    steps:
      - name: Checkout failing commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Create fix branch
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_ID: ${{ github.run_id }}
        run: git switch -c "claude/autofix-${PR_NUMBER}-${RUN_ID}"

      - name: Fix CI failure
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx3g"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: "/fix-ci RUN_ID: ${{ github.event.workflow_run.id }} PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}"
          claude_args: |
            --permission-mode auto
            --model ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
            --max-turns 30
            --allowedTools "Edit,MultiEdit,Read,Glob,Grep,Bash(./gradlew testMockDebugUnitTest:*),Bash(./gradlew :chimera-core:test:*),Bash(./gradlew :core-model:test:*),Bash(./gradlew :core-model:check:*),Bash(./gradlew :core-database:lint:*),Bash(./gradlew :app:lintMockDebug:*),Bash(./gradlew :app:testMockDebugUnitTest:*),Bash(./gradlew detekt:*),Bash(gh run view:*),Bash(gh run list:*),Bash(gh pr comment:*),Bash(git status),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push origin claude/autofix-:*)"
            --disallowedTools "WebFetch,WebSearch,Bash(curl:*),Bash(gh api:*),Bash(git push --force*),Bash(./gradlew assembleProdRelease:*),Bash(./gradlew bundleProdRelease:*),Bash(./gradlew publish:*),Bash(bash scripts/deploy-ci.sh:*),Bash(bash scripts/deploy-termux.sh:*)"
