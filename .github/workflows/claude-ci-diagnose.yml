name: claude-ci-diagnose

# REPORT-ONLY. When a PR build fails, Claude reads the failed-job log and the base branch code and
# posts one diagnosis-and-suggested-patch comment on the PR. It never edits, commits or pushes, never
# checks out the PR head and never runs Gradle. Advisory; never a required check.
# The log is saved by a deterministic step (size-capped); Claude only reads that file. The comment is
# posted by a separate job that holds no Claude credentials.

on:
  # zizmor: ignore[dangerous-triggers] -- same-repo PRs only; base checkout, PR head never checked out or executed; Claude has Read/Glob/Grep only; env scrub on; comment posted by a separate job without secrets
  workflow_run:
    workflows: ["Chimera Android CI/CD", "CI", "PR Checks"]
    types: [completed]

permissions: {}

jobs:
  diagnose:
    if: |
      vars.CLAUDE_PAUSE != 'true' &&
      github.actor != 'dependabot[bot]' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ${{ vars.CLAUDE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    concurrency:
      group: claude-ci-diagnose-${{ github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: true
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
    permissions:
      contents: read
      actions: read
    outputs:
      diagnosis: ${{ steps.diag.outputs.structured_output }}
    steps:
      - name: Checkout base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Save failed-job log
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/ci-log"
          gh run view "$RUN_ID" --repo "$REPO" --log-failed 2>&1 | head -c 60000 > "$RUNNER_TEMP/ci-log/failed.log" || true
          if [ ! -s "$RUNNER_TEMP/ci-log/failed.log" ]; then
            echo "(no failed-job log could be fetched)" > "$RUNNER_TEMP/ci-log/failed.log"
          fi

      - name: Diagnose CI failure
        id: diag
        continue-on-error: true
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "/ci-diagnose PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }} LOG_FILE: ${{ runner.temp }}/ci-log/failed.log"
          claude_args: |
            --permission-mode auto
            --model ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5-5' }}
            --max-turns 15
            --add-dir ${{ runner.temp }}/ci-log
            --allowedTools "Read,Glob,Grep"
            --disallowedTools "Edit,MultiEdit,Write,Bash,WebFetch,WebSearch"
            --json-schema '{"type":"object","required":["diagnosis","confidence"],"properties":{"diagnosis":{"type":"string"},"suggested_patch":{"type":"string"},"confidence":{"enum":["low","medium","high"]}}}'

  post:
    needs: diagnose
    if: ${{ !cancelled() && needs.diagnose.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: claude-ci-diagnose-post-${{ github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: true
    permissions:
      pull-requests: write
    steps:
      - name: Post diagnosis comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          OUT: ${{ needs.diagnose.outputs.diagnosis }}
        run: |
          set -euo pipefail
          if [ -z "${OUT:-}" ]; then
            echo "::warning::Claude returned no diagnosis (rate limit or error); nothing posted."
            exit 0
          fi
          {
            echo "### Claude CI diagnosis (report only)"
            echo
            printf '%s\n' "$OUT" | jq -r '.diagnosis // "(none)" | .[0:6000]'
            echo
            echo "Suggested patch (not applied; review before use):"
            echo '```diff'
            printf '%s\n' "$OUT" | jq -r '.suggested_patch // "(none)" | .[0:6000]'
            echo '```'
            echo "Confidence: $(printf '%s' "$OUT" | jq -r '.confidence // "unknown"'). Failed run: $RUN_URL"
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/comment.md"
