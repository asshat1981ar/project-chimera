name: claude

# Tag mode: answers @claude on issues, PR comments and PR reviews (owner only).
# Needs secret CLAUDE_CODE_OAUTH_TOKEN and the Claude GitHub App (see docs/claude-automation.md).

on:
  # zizmor: ignore[dangerous-triggers] -- owner-only if:, no PR head checkout; the action also requires write access
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions: {}

jobs:
  claude:
    # Owner-only defence in depth on a public repo; the action re-checks write access.
    if: |
      vars.CLAUDE_PAUSE != 'true' &&
      github.actor != 'dependabot[bot]' &&
      github.actor == github.repository_owner && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ${{ vars.CLAUDE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx3g"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # Deliberate: android.yml builds claude/** pushes, so every Claude branch gets CI.
          branch_prefix: "claude/"
          include_comments_by_actor: "asshat1981ar,coderabbitai[bot]"
          exclude_comments_by_actor: "dependabot[bot],renovate[bot]"
          claude_args: |
            --permission-mode auto
            --model ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
            --max-turns 50
            --allowedTools "Bash(./gradlew testMockDebugUnitTest:*),Bash(./gradlew :chimera-core:test:*),Bash(./gradlew :core-model:test:*),Bash(./gradlew :core-model:check:*),Bash(./gradlew :core-database:lint:*),Bash(./gradlew :app:lintMockDebug:*),Bash(./gradlew :app:testMockDebugUnitTest:*),Bash(./gradlew detekt:*),Bash(./gradlew assembleMockDebug:*),Bash(git status),Bash(git diff:*),Bash(git log:*)"
            --disallowedTools "WebFetch,WebSearch,Bash(./gradlew assembleProdRelease:*),Bash(./gradlew bundleProdRelease:*),Bash(./gradlew publish:*),Bash(bash scripts/deploy-ci.sh:*),Bash(bash scripts/deploy-termux.sh:*),Bash(curl:*),Bash(gh api:*)"
            --append-system-prompt "CI context. Follow CLAUDE.md cleanup rules: smallest safe batch, keep the build green, update docs when commands or structure change. Run ./gradlew detekt and ./gradlew testMockDebugUnitTest before finishing; for chimera-core-only changes ./gradlew :chimera-core:test is enough."
