name: claude-review

# Agent mode: automatic PR review through the /review-pr command (.claude/commands/review-pr.md).
# Read-only: the review never edits files. Same-repo PRs only; the PR head is read, never built or run.
# Comment filters are tag-mode-only, so this agent-mode job is told not to read PR comments.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    branches: [main]
    paths:
      - "**/*.kt"
      - "**/*.kts"
      - "**/schemas/**"
      - "gradle/**"
      - "detekt.yml"
      - "app/proguard-rules.pro"
      - "proguard-rules.pro"

permissions: {}

jobs:
  review:
    if: |
      vars.CLAUDE_PAUSE != 'true' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.CLAUDE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Review pull request
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: "true"
          prompt: "/review-pr REPO: ${{ github.repository }} PR_NUMBER: ${{ github.event.pull_request.number }}"
          claude_args: |
            --permission-mode auto
            --model ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5-5' }}
            --max-turns 30
            --allowedTools "Read,Glob,Grep,Task,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
            --disallowedTools "Edit,MultiEdit,Write,WebFetch,WebSearch"
